name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm --filter studio install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter studio test --run

      - name: gen-design lint (--no-compile)
        run: pnpm --filter studio exec tsx scripts/gen-design.ts lint --chat-root playground/chats --no-compile

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm --filter studio install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter studio exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm --filter studio test:e2e

  a11y:
    name: A11y Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm --filter studio install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter studio exec playwright install --with-deps chromium

      - name: A11y check
        run: pnpm --filter studio test:a11y
