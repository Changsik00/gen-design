name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 같은 ref 의 중복 run (push + pull_request 동시 트리거) 정리 — 최신만 유지
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter studio test --run

      # gen-design lint + dogfooding: playground/ 삭제(phase-13 정리)로 임시 비활성화
      # spec-13-05 (e2e 재설계) 완료 후 새 경로로 복원 예정
      # - name: gen-design lint (--no-compile)
      #   run: pnpm --filter studio exec gen-design lint --chat-root playground/chats --no-compile
      # - name: Dogfooding score
      #   run: pnpm --filter studio dogfooding

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate fixtures
        run: pnpm --filter studio fixtures:gen

      - name: Install Chromium
        run: pnpm --filter studio exec playwright install --with-deps chromium

      - name: E2E Tests
        run: pnpm --filter studio test:e2e
