name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --filter studio install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter studio test --run

      - name: gen-design lint (--no-compile)
        run: pnpm --filter studio exec tsx scripts/gen-design.ts lint --chat-root playground/chats --no-compile
